[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airoa-parc2026"
version = "0.1.0"
description = "Pinned LeRobot pi0.5 LIBERO-Plus pipeline for PARC 2026 Track 1"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "PyYAML==6.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The official validator requires this file to stay byte-identical outside MyPolicy.
"submission/policy_server.py" = ["I001"]
